<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src 'self' https://ebtwconvpishorpdwqvb.supabase.co; img-src 'self' data: https://ebtwconvpishorpdwqvb.supabase.co; media-src 'self' https://ebtwconvpishorpdwqvb.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
    />
    <title>블로그</title>
    <meta
      name="description"
      content="짧은 기록을 담는 미니멀 개인 블로그"
    />
    <link rel="stylesheet" href="./styles.css?v=20260513-visual-editor" />
  </head>
  <body>
    <main class="page">
      <aside class="sidebar" aria-label="블로그 메뉴">
        <a class="site-name" href="#" aria-label="홈으로">
          <span>블로그</span>
        </a>
        <button id="new-post" class="plain-button admin-only" type="button" hidden>
          쓰기
        </button>

        <label class="search-field" for="search">
          <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="Search this site..."
          />
        </label>

        <nav class="post-list" aria-label="글 목록">
          <p class="small-title">Archive</p>
          <div id="posts" class="posts"></div>
          <p id="stats" class="stats"></p>
        </nav>
      </aside>

      <section class="content">
        <section id="editor" class="editor" aria-label="글쓰기" hidden>
          <form id="editor-form">
            <input id="editor-title" type="text" placeholder="제목" required />
            <div class="editor-toolbar" aria-label="서식">
              <button type="button" data-format="heading" aria-label="소제목" title="소제목">H</button>
              <button type="button" data-format="bold" aria-label="굵게" title="굵게">B</button>
              <button type="button" data-format="italic" aria-label="기울임" title="기울임">I</button>
              <button type="button" data-format="quote" aria-label="인용" title="인용">인용</button>
              <button type="button" data-format="link" aria-label="링크" title="링크">링크</button>
              <button type="button" data-file-input="editor-image" aria-label="이미지 첨부" title="이미지 첨부">이미지</button>
              <button type="button" data-file-input="editor-video" aria-label="영상 첨부" title="영상 첨부">영상</button>
            </div>
            <input id="editor-image" type="file" accept="image/*" hidden />
            <input id="editor-video" type="file" accept="video/*" hidden />
            <div
              id="editor-surface"
              class="editor-surface article-body"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              data-placeholder="본문"
            ></div>
            <textarea id="editor-body" hidden></textarea>
            <p id="editor-status" class="small-text" aria-live="polite"></p>
            <div class="editor-actions">
              <button type="submit">저장</button>
              <button id="cancel-edit" type="button">취소</button>
            </div>
          </form>
        </section>

        <article id="article" class="article" aria-live="polite"></article>
      </section>

      <section class="subscription" aria-label="이메일 구독">
        <form id="subscribe-form" class="subscribe-form">
          <input
            id="subscriber-email"
            type="email"
            autocomplete="email"
            placeholder="email"
            required
          />
          <button type="submit">Subscribe by Email</button>
        </form>
        <p id="subscribe-status" class="small-text" aria-live="polite"></p>
      </section>
    </main>

    <section
      id="admin-panel"
      class="admin-panel"
      role="dialog"
      aria-modal="true"
      aria-label="관리자"
      hidden
    >
      <div class="admin-inner">
        <button id="close-admin" class="plain-button" type="button">닫기</button>
        <p id="admin-title" class="small-title">관리</p>
        <form id="admin-form" class="admin-form">
          <input
            id="admin-username"
            type="email"
            autocomplete="username"
            placeholder="email"
            required
          />
          <input
            id="admin-password"
            type="password"
            autocomplete="current-password"
            placeholder="비밀번호"
            required
          />
        <button id="admin-submit" type="submit">로그인</button>
        </form>
        <button id="logout-admin" class="plain-button" type="button" hidden>
          로그아웃
        </button>
        <p id="admin-status" class="small-text" aria-live="polite"></p>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./script.js?v=20260513-media-private"></script>
  </body>
</html>
